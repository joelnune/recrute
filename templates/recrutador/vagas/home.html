<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Minhas vagas:</h1>
    <table>
        <thead>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
        </thead>
        <tbody>
            {% for vaga in vagas %}
                <tr>
                    <td>{{ vaga.titulo }}</td>
                    <td>{{ vaga.descricao }}</td>
                    <td>{{ vaga.salario }}</td>
                    <td> <a href="{% url 'recrutamento:recrutador_vagas_editar' vaga.id %}"> Editar </a> </td>
                    <td> <a href="{% url 'recrutamento:recrutador_vagas_remover' vaga.id %}"> Remover </a> </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'recrutamento:recrutador_vagas_criar' %}"> Criar Vaga</a>
</body>
</html>
