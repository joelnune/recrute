<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">


    <title>Cadastro Candidato</title>
</head>
<body>
    <h1> Cadastro Recrutador:</h1>
        <form action="" method="post">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ recrutador_form.as_p }}
            <input type="submit" value="Enviar">
        </form>

    <script>
    document.getElementById('id_cnpj').addEventListener('blur', async function () {
    let cnpj = this.value.replace(/\D/g, '');
    if (cnpj.length !== 14) {
        console.log('CNPJ inválido');
        return;
    }
    try {
        const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);

        if (!response.ok) {
            throw new Error('CNPJ não encontrado');
        }

        const data = await response.json();

        // Preenche o campo empresa automaticamente
        document.getElementById('id_nome_empresa').value = data.razao_social || data.nome_fantasia || '';

    } catch (error) {
        console.error('Erro ao buscar CNPJ:', error);
        alert('CNPJ inválido ou erro na consulta');
    }
});
</script>
</body>
</html>
